# Everything a change must pass before it is merged: the full test suite (Python and, from inside it, the Node
# implementation), the 70-case conformance suite against both implementations, lint and types. CNS is installed
# from the pin in pyproject.toml, not from its main branch.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    name: test (py${{ matrix.python }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: PostgreSQL server binaries (the ledger tests start real throwaway clusters, they do not mock the database)
        run: |
          if ! ls /usr/lib/postgresql/*/bin/pg_ctl >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y postgresql
          fi
          ls /usr/lib/postgresql/*/bin/pg_ctl
      - name: Node for the second UAI-1 implementation (the suite runs it and fails without it)
        run: node --version
      - name: Tests
        run: python -m pytest -q
      - name: Conformance, Python reference (70 cases)
        run: python contracts/uai1/run_conformance.py --cmd "python interop/conformance/reference_adapter.py"
      - name: Conformance, Node (70 cases)
        run: python contracts/uai1/run_conformance.py --cmd "node interop/node/conformance_adapter.mjs"
      - name: Lint (ruff, rules named in pyproject.toml, version pinned in the dev extra)
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy cns_interop uai
